aid: embodyme
name: EmbodyMe
description: >-
  EmbodyMe, Inc. is a Tokyo-based AI company building real-time neural rendering
  and 3D dense face-tracking technology for photorealistic digital humans. Its
  flagship developer product, DigiSelf, turns a single photo into a lifelike AI
  avatar that speaks from text or audio in dozens of languages, in both
  pre-recorded video and sub-second real-time interactive modes. The DigiSelf
  Realtime API (api.digiself.tech) and Stream API (WebSocket) let developers
  drive avatars into LiveKit rooms, Google Meet meeting bots, chatbots, live
  streaming, gaming, and advertising via an x-api-key protected REST + WebSocket
  surface. EmbodyMe also ships the xpression camera, xpression chat, and
  xpression avatar consumer apps and a cross-platform Real-time AI Video
  Generation SDK for iOS, Android, Windows, and Mac. Backed by Techstars, with
  recognition from NVIDIA, Microsoft, Product Hunt, and SIGGRAPH ASIA.
